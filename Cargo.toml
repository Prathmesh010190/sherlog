[package]
name = "sherlog"
version = "0.1.0"
edition = "2021"
description = "A developer-focused error debugging assistant for the terminal"
license = "MIT"
repository = "https://github.com/sherlog-cli/sherlog"
readme = "README.md"
keywords = ["debugging", "cli", "error-analysis", "developer-tools", "logs"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
colored = "2"
dirs = "5"
regex = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strip-ansi-escapes = "0.2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
